version: '3.8'

services:
  distillery-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: parrys_aura_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server/instance:/app/instance
    environment:
      - PYTHONUNBUFFERED=1
